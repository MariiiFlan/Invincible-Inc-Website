<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Server Shop — Invincible Inc</title>
<meta name="description" content="Ranks, crate keys and the Battle Pass for the Invincible Incorporated Minecraft server. Secure checkout, instant in-game delivery.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Barlow:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:'Barlow',sans-serif;min-height:100vh}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#2a2f3a;border-radius:4px}
:focus-visible{outline:3px solid #9eff2a;outline-offset:2px}

.bar{background:#000;border-bottom:2px solid #1c1c1c;padding:18px 56px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.home{font-family:'Anton';font-style:italic;font-size:13px;letter-spacing:.5px;color:#8a90a0;display:block;margin-bottom:4px}
.home:hover{color:#FFD23D}
.h1{font-family:'Anton';font-style:italic;font-size:30px;line-height:.9}
.secure{font-weight:800;font-size:11px;letter-spacing:1px;color:#8a90a0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9eff2a;box-shadow:0 0 8px #9eff2a;margin-right:8px}

.wrap{max-width:1320px;margin:0 auto;padding:32px 56px 72px}
.kicker{font-family:'Bangers',cursive;font-size:15px;letter-spacing:3px;color:#FFD23D}
.big{font-family:'Anton';font-style:italic;font-size:38px;margin:2px 0 22px}

.cats{background:#000;border:4px solid #000;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cat{position:relative;overflow:hidden;min-height:158px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s}
.cat:hover{transform:scale(1.03)}
.cat.soon{cursor:not-allowed}
.cat.soon:hover{transform:none}
.cat .dots{position:absolute;inset:0;opacity:.16;background-image:radial-gradient(#000 1.3px,transparent 1.6px);background-size:9px 9px}
.cat .glyph{position:relative;font-family:'Anton';font-style:italic;font-size:30px;line-height:1}
.cat .foot{position:relative}
.cat .name{font-family:'Anton';font-style:italic;font-size:22px;line-height:.9}
.cat .sub{font-weight:700;font-size:11px;opacity:.8}

.card{margin-top:24px;background:#0d0f14;border:3px solid #fff;box-shadow:8px 8px 0 rgba(0,0,0,.6);padding:22px 26px}
.card .ck{font-family:'Bangers',cursive;font-size:14px;letter-spacing:2px;color:#FFD23D}
.card .ct{font-family:'Anton';font-style:italic;font-size:28px;line-height:.9;margin:2px 0 14px}
.pay{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid #1b2130}
.pay:first-child{border-top:none}
.pay img{width:32px;height:32px;border:2px solid #243044;image-rendering:pixelated;flex:none}
.pay .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay .u{font-family:'Anton';font-style:italic;font-size:15px}
.pay .p{font-weight:700;font-size:12px;color:#8a93a6}
.pay .amt{font-family:'Anton';font-style:italic;font-size:15px;color:#FFD23D;white-space:nowrap;flex:none}
.placeholder{font-weight:700;font-size:13px;color:#5b6270;padding:8px 0}

.star[hidden]{display:none}
.star{margin-top:24px;background:#FFD23D;border:3px solid #fff;box-shadow:8px 8px 0 rgba(0,0,0,.6);display:grid;grid-template-columns:200px 1fr}
.star .avatar{border-right:3px solid #111;background:#fff;position:relative;overflow:hidden;min-height:190px}
.star .avatar img{width:100%;height:100%;object-fit:contain;object-position:bottom}
.star .tag{position:absolute;left:8px;bottom:8px;background:#E11515;color:#fff;font-family:'Bangers',cursive;font-size:13px;letter-spacing:1px;padding:3px 10px;border:2px solid #fff}
.star .body{padding:22px 26px;display:flex;flex-direction:column;justify-content:center}
.star .sk{font-family:'Bangers',cursive;font-size:14px;letter-spacing:2px;color:#7a6a1f}
.star .sn{font-family:'Anton';font-style:italic;font-size:40px;color:#111;line-height:.9;margin:2px 0 4px}
.star .sm{font-weight:800;font-size:12px;color:#7a6a1f;margin-bottom:10px}

@media(max-width:1080px){.cats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
  .bar,.wrap{padding-left:20px;padding-right:20px}
  .big{font-size:30px}
  .star{grid-template-columns:1fr}
  .star .avatar{border-right:none;border-bottom:3px solid #111;min-height:150px}
  .star .sn{font-size:30px}
}
@media(max-width:520px){.cats{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="bar">
  <div>
    <a class="home" href="/">&lsaquo; INVINCIBLE INCORPORATED</a>
    <div class="h1">SERVER SHOP</div>
  </div>
  <div class="secure"><span class="dot"></span>SECURE CHECKOUT &middot; INSTANT IN-GAME DELIVERY</div>
</div>

<div class="wrap">
  <div class="kicker">STRAIGHT OFF THE PRESS</div>
  <h2 class="big">SHOP CATEGORIES</h2>

  <div class="cats" id="cats"></div>

  <section class="card">
    <div class="ck">HOT OFF THE PRESS</div>
    <h2 class="ct">RECENT PURCHASES</h2>
    <div id="recent"><div class="placeholder">Loading recent purchases…</div></div>
  </section>

  <section class="star" id="star" hidden>
    <div class="avatar">
      <img id="supAvatar" alt="">
      <div class="tag">COVER STAR</div>
    </div>
    <div class="body">
      <div class="sk">SUPPORTER OF THE MONTH</div>
      <div class="sn" id="supName">—</div>
      <div class="sm" id="supMeta"></div>
    </div>
  </section>
</div>

<script>
/* =====================================================================
   SERVER SHOP — storefront.
   CATEGORIES : edit this list to add / rename / re-order shop tiles.
                live:false renders a locked "COMING SOON" tile.
   TOKEN      : your Tebex headless public token (used for the live
                recent-purchases + top-supporter panels).
   ===================================================================== */
var TOKEN = 'v7x1-d56f91e2669f8af87a3481d30edc66e27808fe60';

var CATEGORIES = [
  { name:'RANKS',       sub:'5 tiers',  color:'#2E6BFF', fg:'#fff', glyph:'★', href:'/shop/shop-ranks/index.html',  live:true },
  { name:'CRATES',      sub:'10 crates',color:'#FFD23D', fg:'#111', glyph:'◆', href:'/shop/crates/index.html',      live:true },
  { name:'BATTLE PASS', sub:'Season 0', color:'#E11515', fg:'#fff', glyph:'✦', href:'/shop/battle-pass/index.html', live:true },
  { name:'COMING SOON', sub:'', color:'#15171d', fg:'#5b6270', glyph:'?', href:'#', live:false },
  { name:'COMING SOON', sub:'', color:'#15171d', fg:'#5b6270', glyph:'?', href:'#', live:false },
  { name:'COMING SOON', sub:'', color:'#15171d', fg:'#5b6270', glyph:'?', href:'#', live:false },
  { name:'COMING SOON', sub:'', color:'#15171d', fg:'#5b6270', glyph:'?', href:'#', live:false },
  { name:'COMING SOON', sub:'', color:'#15171d', fg:'#5b6270', glyph:'?', href:'#', live:false }
];

function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(x){
  return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[x]; }); }

/* ---- category tiles ---- */
document.getElementById('cats').innerHTML = CATEGORIES.map(function(c){
  var tag = c.live ? 'a' : 'div';
  return '<' + tag + ' class="cat' + (c.live ? '' : ' soon') + '"' +
    (c.live ? ' href="' + esc(c.href) + '"' : ' aria-disabled="true"') +
    ' style="background:' + c.color + ';color:' + c.fg + '">' +
    '<div class="dots"></div>' +
    '<div class="glyph">' + c.glyph + '</div>' +
    '<div class="foot"><div class="name">' + esc(c.name) + '</div>' +
    (c.sub ? '<div class="sub">' + esc(c.sub) + '</div>' : '') + '</div>' +
    '</' + tag + '>';
}).join('');

/* ---- live Tebex panels ---- */
(function(){
  var SYM = { USD:'$', EUR:'€', GBP:'£', CAD:'$', AUD:'$', NZD:'$' };
  function money(p, c){
    if (p == null || p === '') return '';
    var s = SYM[c] || '';
    var n = Number(p).toFixed(2);
    return s ? (s + n) : (n + (c ? (' ' + c) : ''));
  }
  var box = document.getElementById('recent');

  fetch('https://headless.tebex.io/api/accounts/' + TOKEN + '/sidebar', { headers:{ Accept:'application/json' } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var mods = (j && j.data) ? j.data : [];
      var recent = null, top = null, cur = null;
      mods.forEach(function(m){
        if (m.type === 'recent_payments') recent = m;
        if (m.type === 'top_customer')    top = m;
      });

      var pays = (recent && recent.data && recent.data.payments) ? recent.data.payments : [];
      if (pays.length){
        box.innerHTML = pays.map(function(p){
          if (p.currency && !cur) cur = p.currency;
          var user = p.username || 'MHF_Steve';
          var price = money(p.price, p.currency);
          return '<div class="pay">' +
            '<img src="https://mc-heads.net/avatar/' + encodeURIComponent(user) + '/32" width="32" height="32" alt="" ' +
            'onerror="this.style.visibility=&quot;hidden&quot;">' +
            '<div class="who"><span class="u">' + esc(p.username || 'Anonymous') + '</span>' +
            '<span class="p"> — ' + esc((p.package && p.package.name) || '') + '</span></div>' +
            (price ? '<div class="amt">' + esc(price) + '</div>' : '') +
            '</div>';
        }).join('');
      } else {
        box.innerHTML = '<div class="placeholder">No purchases yet — be the first!</div>';
      }

      if (top && top.data && top.data.username){
        document.getElementById('star').hidden = false;
        document.getElementById('supName').textContent = top.data.username;
        document.getElementById('supMeta').textContent = 'TOP SUPPORTER' +
          (top.data.total != null ? (' · ' + money(top.data.total, cur || 'USD') + ' CONTRIBUTED') : '');
        var av = document.getElementById('supAvatar');
        av.onerror = function(){ this.style.display = 'none'; };
        av.alt = top.data.username + "'s Minecraft skin";
        av.src = 'https://mc-heads.net/body/' + encodeURIComponent(top.data.username) + '/right';
      }
    })
    .catch(function(){
      box.innerHTML = '<div class="placeholder">Couldn\'t load recent purchases right now.</div>';
    });
})();
</script>
</body>
</html>
