<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Changelogs — Invincible Incorporated</title>
  <meta name="description" content="Every Invincible Incorporated update, fix and new power — including the v2.0 Lineage / Server Ready release.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="changelogs">
  <div id="site-header"></div>

  <main class="log-page">
    <div class="log-head">
      <div>
        <div class="page-eyebrow">THE PAST</div>
        <h1>THE <span class="accent">CHANGELOGS</span></h1>
        <p class="log-lede">Every update, fix and new power. Newest at the top — <strong>v2.0 Lineage</strong> is next out of the gate.</p>
      </div>
      <div class="log-stats" id="logStats"></div>
    </div>

    <div class="log-toolbar">
      <span class="tlabel">Show</span>
      <button class="chip is-active" data-filter="all" type="button">Everything</button>
      <button class="chip chip--add" data-filter="add" type="button">Added</button>
      <button class="chip chip--chg" data-filter="chg" type="button">Changed</button>
      <button class="chip chip--rem" data-filter="rem" type="button">Removed</button>
    </div>

    <div class="log-layout">
      <nav class="log-rail" id="logRail" aria-label="Jump to version"></nav>
      <div class="log-list" id="log"></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/site.js"></script>

  <script>
  /* ============================================================
     CHANGELOG DATA — newest first.
     Each entry: { ver, title, desc?, status?, items?, groups? }
       status: "soon"  -> COMING SOON badge (not released yet)
               "latest"-> LATEST badge (current downloadable build)
               omitted -> a normal past release
       items:  [ ["add"|"chg"|"rem", "text"], ... ]
       groups: [ { name:"Sub-heading", items:[ ... ] }, ... ]
     Tags: add = ADDED (green), chg = CHANGED (yellow), rem = REMOVED (red)
     Wrap code/IDs in `backticks` to style them.
     ============================================================ */
  const CHANGELOG = [
    {
      ver: "v2.0",
      title: "Lineage / Server Ready — the biggest update yet",
      status: "soon",
      desc: "Two new powers, a full economy, the Vendetta system, rebuilt groups and factions, a cinematic flight overhaul and a custom animation engine. This is the build the server runs on.",
      groups: [
        { name: "Infrastructure", items: [
          ["chg", "Darkness Core is now a hard dependency — the engine mod ships alongside Invincible Inc and is required to launch."],
          ["add", "JEI integration — blueprints, genetics items and recipes now show up in JEI with their own info pages."],
          ["chg", "NeoForge requirement bumped to `21.1.216+`."],
          ["add", "New gamerules: `invincibleEvents`, `invincibleLockOn`, `invincibleFlyingLockOn`, `aliasInChat`, `showMobStatsOnSpawn`."]
        ]},
        { name: "New powers", items: [
          ["add", "Energy Absorption (Powerplex's power) — Arch Lightning, Arch Shot, Lightning Strike, Powerline, Powerplex and Pulsating Wave, with a new charge / absorb / wave sound set."],
          ["add", "Molecular Acceleration (Rex Splode's power) — Charged Fist, Ground Boost, Ground Charge, Scatter Mines, Single Acceleration and Triple Scatter, with new activate / charge / explosion / throw sounds."]
        ]},
        { name: "New abilities & effects", items: [
          ["add", "Abilities: Arch Lightning, Lightning Strike, Powerline, Powerplex (+ Powerplex Victim), Charged Fist, Ground Boost, Ground Charge, Scatter Mines, Single Acceleration, Triple Scatter."],
          ["add", "Effects: Certain Impact Frame, Mastery CD, No Combat, XP Multiplier."],
          ["add", "New projectiles — Arch Shot, Scatter Mine, Single Acceleration."],
          ["add", "New impact sounds: 5 light-punch and 3 heavy-punch variants."]
        ]},
        { name: "New entities", items: [
          ["add", "Male Viltrumite, Female Viltrumite, Zechariah, and the Suit Model (the shop mannequin)."],
          ["add", "New spawn eggs for Zechariah and the Unnamed Viltrumite."],
          ["chg", "The old plural `unnamed_viltrumites` entity is now the singular Unnamed Viltrumite."]
        ]},
        { name: "Battle Pass & economy (all new)", items: [
          ["add", "50-tier Battle Pass — claim and claim-all, purchase, reward sets, progress tracking, full sync networking, a dedicated screen and its own commands."],
          ["add", "InvinciCoins — the mod's currency, as an item plus commands."],
          ["add", "Item Shop — buy / edit / open flows, a manager, a screen and commands."],
          ["add", "Suit Exclusives — a registry, an enforcer and commands that protect season-exclusive suits."],
          ["add", "XP Multiplier potions."]
        ]},
        { name: "Suit shop & cosmetics", items: [
          ["add", "A full multi-page Arts Suit Shop with category tabs: Main Page, Guardians of the Globe, Teen Team, Unaffiliated, GDA, Immortal, Darkwing, Kid Omni, Omni-Man, Zechariah and Invincible Suits (pages 1–2), plus a cash label and paged navigation."],
          ["add", "Invincible variants: Bulletproofible, Capvincible, Capevincible (Sinister-Mark), Gogglesvincible, Hoodvincible (Sheisty-Mark), Lightbluecible, Maskvincible, Mohawkvincible, Movincihawk, Omnivincible, Omni-Mark, Sinister-Mark, Sportsvincible, Sportsvincible (Comic), Stripevincible, Flaxancible and Viltrumite Prisoner (Prisonincible)."],
          ["add", "Character suits: Kid Omni-Man (+ V2), Rex Splode, War Woman, Immortal, Cecil's Suit, GDA Combat Suit (+ Special), Flaxan Armor, Bulletproof, Omni-Man (Cobalt), Viltrumite (Onyx), Viltrumite Council and Zechariah."],
          ["add", "Capes: Omni-Mark, Sinister-Mark and War Woman."],
          ["add", "Comics: Invincible Incorporated Issues #1, #2 (+ variant cover) and #3."]
        ]},
        { name: "Groups, parties & factions", items: [
          ["add", "A new `group` engine — GroupManager + GroupData, GroupGui / GroupScreen, custom Group Banners (banner menu and flat-banner rendering), group chat with name filtering, group events and commands."],
          ["add", "Factions — FactionManager, FactionData and faction commands."],
          ["rem", "The old procedure-based group system (create / join / kick / invite / disband) — fully replaced by the new group engine."]
        ]},
        { name: "Vendetta system (new)", items: [
          ["add", "A full grudge / revenge system: Vendetta combat, data, config, death-roll, dialogue, events, spawn hooks, stat application and auto-stamp."],
          ["add", "Admin and debug commands, plus a Vendetta Debugger item."]
        ]},
        { name: "Flight overhaul + flight FX", items: [
          ["add", "A cinematic flight package — reentry glow, charge glow (block and entity layers), landing shockwave, ground disturbance, flight heat / burn, camera shake, dynamic FOV and a silhouette manager."],
          ["add", "A Flight Style menu."],
          ["chg", "New mixins for flight camera centering, elytra / armor flight fixes, and cancelling fly-into-wall damage."]
        ]},
        { name: "Custom animation engine (new)", items: [
          ["add", "Two full keyframe animation frameworks — third-person (`tpanim`) and first-person (`fpanim`) — each with an in-game editor screen, playback, pose / lean / noise drivers, networking and Blockbench export."],
          ["add", "A flight-pose driver and a dev animator tool."],
          ["chg", "Many new rendering mixins to drive player animation."]
        ]},
        { name: "Blood FX & lock-on", items: [
          ["add", "Blood FX — BloodFx plus world FX, a HUD renderer, blood triggers and a Blood Settings screen (toggle and intensity)."],
          ["add", "Lock-on — target lock-on (LockOnSystem + network message) with a \"Lock On\" keybind and dedicated ground and flying lock-on gamerules."]
        ]},
        { name: "UI reworks", items: [
          ["chg", "Origin Sheet reworked (new OriginSheetGUI2)."],
          ["chg", "Race Passive GUI and Power Passive GUI rebuilt as dedicated screens."],
          ["add", "New Customization Menu, Daily Mission tab and Flight Style menu."],
          ["add", "Ability row swapping — reorderable ability slots across all 5 slots, with a new swap message and procedure."],
          ["rem", "The old inventory-tab button system, its client events, the ShowAbilities overlay and the old Viltrumite passives button message — replaced by the new menus."]
        ]},
        { name: "Admin & chat tools (new)", items: [
          ["add", "Alias chat — nicknames in chat, toggled with the `aliasInChat` gamerule."],
          ["add", "Admin add / XP commands, a Tech Jacket command and a combat admin command."],
          ["add", "A Test Dummy system for damage testing."]
        ]},
        { name: "Balance & reworks", items: [
          ["chg", "Combat reworked across the Standard and Viltrumite fighting styles."],
          ["chg", "NPC spawning, race stat multipliers, power stat multipliers, passive unlocking and the ability-call path (now a new call path) all revised."],
          ["chg", "The origin sheet and every race item — Human, Viltrumite, Beast, Demon, Unopan, Unopan Modified and both hybrids — revised."]
        ]}
      ]
    },
    {
      ver: "v1.4.5",
      title: "The big content drop — NPCs, races, suits, powers & the genetics pipeline",
      status: "latest",
      groups: [
        { name: "New NPCs / entities", items: [
          ["add", "Conquest, General Kregg, Damian Darkblood, Lucan, Thula, Anissa, Monster Girl, Darkwing, unnamed Viltrumites, and the Spirit Dragon — plus new projectiles (Hell Fire Arrow, Dragon's Breath, Bat Attack)."]
        ]},
        { name: "New races, sub-races & powers", items: [
          ["add", "Races: Demon, Unopan, and Unopan (Modified); Sub-race: Vampire (plus Werewolf/Lycanthropy and Dornian progression)."],
          ["add", "Power: Demon Magic (with custom animations)."]
        ]},
        { name: "New suits & gear", items: [
          ["add", "Darkwing v1 & v2 suits, Dracula's Suit, Viltrumite Suit, Werewolf Hunter set, Monster Curse set, and a Cloak — each with its own Blueprint."]
        ]},
        { name: "Genetics / injection crafting chain", items: [
          ["add", "Blocks: Centrifuge, Molecular Synthesizer (Genetic Infuser), Deepslate Uranium."],
          ["add", "Items: Raw Uranium, Raw Unstable Uranium, decaying uranium particles, Empty/Blood Vials, White Blood Cells (isolated + infused), modified genetic samples, the Injection Gun (multiple loaded states), and Demonius Ex Mortum."],
          ["add", "Raw Uranium smelting recipe."]
        ]},
        { name: "Effects & systems", items: [
          ["add", "~25 new effects, including Fear (with sounds), Mist/Bat Swarm form, Intangibility, Shadow Step, Blood Lust, Blood Sacrifice, Soul Drain, Hypnosis, Claws, Radiation Poisoning, Dragon's Rush/Breath, Spirit Dragon transformation, and partial/full transformations."],
          ["add", "15 advancements — origin story, gaining your race, each race (Human/Viltrumite/Demon/Unopan/Dornian), sub-races, and power unlocks (Atomic Manipulation, Demon Magic, Super Speed, Tech Jacket)."],
          ["chg", "Updated race stat scaling for the new races, plus NPC spawning, attacks, and flight AI to handle the new roster."],
          ["rem", "The old suit-creation blocks (Sewing Machine & Suit Creation Bench) — suit creation now uses the blueprint + injection workflow."]
        ]}
      ]
    },
    {
      ver: "v1.4.2",
      title: "Stat reset + adrenaline rework",
      items: [
        ["add", "Stats now reset on respawn."],
        ["chg", "Reworked the Adrenaline effect."]
      ]
    },
    {
      ver: "v1.4.1",
      title: "Bloodline & movement tuning",
      items: [
        ["chg", "Tuned bloodline items and bloodline stat scaling."],
        ["chg", "Adjusted sprint speed, flight display, Atomic Blast, and Sonic Clap (while flying); updated the creative tab."]
      ]
    },
    {
      ver: "v1.4",
      title: "Bloodlines + Genetics menu + Heavy Attack",
      items: [
        ["add", "Bloodlines system — 10 bloodlines (Anissa, Argall, Cho, Conners, Conquest, Clan Darkblood, Thokk, Thragg, Allen/Unopan, Wilkins) with items, textures, random assignment, a blood-type display, and a new Bloodlines creative tab."],
        ["add", "Genetics menu — a new in-game interface for genetics."],
        ["add", "Heavy Attack — hold to perform heavy attacks, with their own cooldowns and a dedicated keybind."],
        ["add", "Super Speed active toggle, plus Atom Eve atomic-flight visuals/models and a thruster texture."],
        ["add", "A new input system for abilities and attacks — smoother, more responsive controls."],
        ["chg", "Reworked combat into a new fighting-style animation system (Beast, Standard, and Viltrumite styles) with flight-combat animations."],
        ["chg", "Renamed the \"Flight Mode\" keybind to \"Movement Passive.\""],
        ["rem", "The old combat handling — replaced by the new fighting-style system."]
      ]
    },
    {
      ver: "v1.3.5",
      title: "Combat Mode cleanup",
      items: [
        ["add", "Combat Mode now ends correctly when it should."],
        ["chg", "Adjusted Combat Mode and Battle Mode so their effects apply and clear cleanly."]
      ]
    },
    {
      ver: "v1.3",
      title: "Battle Mode fixes",
      items: [
        ["chg", "Reworked the Battle Mode toggle for more reliable on/off behavior."]
      ]
    },
    {
      ver: "v1.2",
      title: "Camera Lock + stat caps + groups",
      items: [
        ["add", "Camera Lock effect — locks the player's camera and mouse input."],
        ["add", "Stat limiter system — caps for Strength, Durability, Speed, and Mastery."],
        ["add", "Group creation (party-system groundwork)."],
        ["chg", "Reworked how race/power stats are applied (Human, Viltrumite, Atomic, Super Speed, Tech Jacket, Beast) to respect the new caps."]
      ]
    },
    {
      ver: "v1.1",
      title: "Spawn balancing & loot pass",
      items: [
        ["add", "Heroes and criminals now spawn on the surface only."],
        ["add", "Blueprints can now appear in village chest loot."],
        ["add", "Battle Mode effect support."],
        ["chg", "Cut NPC spawn weights across the board: Criminal 60→20, Tech Jacket NPC 24→14, Atom Eve 25→15, Invinciboy 22→14, Red Rush 20→15, Invincible 25→20, Omni-Man 13→10."],
        ["rem", "An old leftover vanilla mob-tag override."]
      ]
    },
    {
      ver: "v1.0",
      title: "Reboot Launch",
      desc: "Baseline 1.21.1 reboot release. All later entries are measured against this build."
    }
  ];

  (function(){
    function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function fmt(s){ return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
    function slug(v){ return String(v).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }

    var TAG = { add:"ADDED", chg:"CHANGED", rem:"REMOVED" };

    function allItems(e){
      var out = (e.items || []).slice();
      (e.groups || []).forEach(function(g){ out = out.concat(g.items || []); });
      return out;
    }
    function counts(list){
      var c = { add:0, chg:0, rem:0 };
      list.forEach(function(it){ if (c[it[0]] != null) c[it[0]]++; });
      return c;
    }
    function itemLi(it){
      var t = TAG[it[0]] ? it[0] : "chg";
      return '<li class="log-item" data-kind="'+t+'">'+
        '<span class="log-tag log-tag--'+t+'">'+TAG[t]+'</span>'+
        '<span>'+fmt(it[1])+'</span></li>';
    }
    function countChips(c){
      var out = "";
      if (c.add) out += '<span class="log-count log-count--add">'+c.add+' added</span>';
      if (c.chg) out += '<span class="log-count log-count--chg">'+c.chg+' changed</span>';
      if (c.rem) out += '<span class="log-count log-count--rem">'+c.rem+' removed</span>';
      return out ? '<div class="log-counts">'+out+'</div>' : "";
    }

    /* ---------- entries ---------- */
    var html = CHANGELOG.map(function(e){
      var id = "v" + slug(e.ver).replace(/^v/,"");
      var c  = counts(allItems(e));
      var badge = e.status === "soon"   ? '<span class="log-badge log-badge--soon">Coming soon</span>'
                : e.status === "latest" ? '<span class="log-badge log-badge--latest">Latest release</span>' : "";

      var inner = '<div class="log-card-top">'+
        '<span class="log-ver">'+esc(e.ver)+'</span>'+ badge +
        '<a class="log-anchor" href="#'+id+'" aria-label="Link to '+esc(e.ver)+'">#</a></div>';
      if (e.title) inner += '<div class="log-title">'+esc(e.title)+'</div>';
      if (e.desc)  inner += '<p class="log-desc">'+fmt(e.desc)+'</p>';
      inner += countChips(c);
      if (e.items && e.items.length){
        inner += '<ul class="log-items">'+e.items.map(itemLi).join("")+'</ul>';
      }
      (e.groups || []).forEach(function(g){
        inner += '<div class="log-group"><div class="log-group-name">'+esc(g.name)+'</div>'+
          '<ul class="log-items">'+(g.items||[]).map(itemLi).join("")+'</ul></div>';
      });
      return '<article class="log-card'+(e.status === "soon" ? " log-card--soon" : "")+'" id="'+id+'">'+inner+'</article>';
    }).join("");
    document.getElementById("log").innerHTML = html;

    /* ---------- version rail ---------- */
    document.getElementById("logRail").innerHTML =
      '<div class="rlabel">Versions</div>' +
      CHANGELOG.map(function(e){
        var id = "v" + slug(e.ver).replace(/^v/,"");
        var cls = e.status === "soon" ? " has-soon" : (e.status === "latest" ? " has-latest" : "");
        return '<a href="#'+id+'" data-rail="'+id+'" class="'+cls.trim()+'">'+esc(e.ver)+'<span class="rdot"></span></a>';
      }).join("");

    /* ---------- headline stats ---------- */
    var totals = counts(CHANGELOG.reduce(function(a,e){ return a.concat(allItems(e)); }, []));
    document.getElementById("logStats").innerHTML =
      '<div class="log-stat"><div class="n">'+CHANGELOG.length+'</div><div class="l">Releases</div></div>'+
      '<div class="log-stat log-stat--add"><div class="n">'+totals.add+'</div><div class="l">Added</div></div>'+
      '<div class="log-stat log-stat--chg"><div class="n">'+totals.chg+'</div><div class="l">Changed</div></div>'+
      '<div class="log-stat log-stat--rem"><div class="n">'+totals.rem+'</div><div class="l">Removed</div></div>';

    /* ---------- filters ---------- */
    var chips = Array.prototype.slice.call(document.querySelectorAll(".chip[data-filter]"));
    chips.forEach(function(btn){
      btn.addEventListener("click", function(){
        var f = btn.getAttribute("data-filter");
        chips.forEach(function(b){ b.classList.toggle("is-active", b === btn); });
        document.querySelectorAll(".log-item").forEach(function(li){
          li.hidden = !(f === "all" || li.getAttribute("data-kind") === f);
        });
        // hide any card / group that has nothing left to show
        document.querySelectorAll(".log-group").forEach(function(g){
          g.hidden = !g.querySelector(".log-item:not([hidden])");
        });
        document.querySelectorAll(".log-card").forEach(function(card){
          var hasItems = !!card.querySelector(".log-item:not([hidden])");
          card.hidden = (f !== "all") && !hasItems;
        });
        var visible = document.querySelector(".log-card:not([hidden])");
        var list = document.getElementById("log");
        var empty = document.getElementById("logEmpty");
        if (!visible && !empty){
          list.insertAdjacentHTML("beforeend",
            '<div class="log-empty" id="logEmpty">Nothing matches that filter.</div>');
        } else if (visible && empty){
          empty.remove();
        }
      });
    });

    /* ---------- rail highlight on scroll ---------- */
    var cards = Array.prototype.slice.call(document.querySelectorAll(".log-card"));
    function syncRail(){
      var visible = cards.filter(function(c){ return !c.hidden; });
      var best = visible[0] || null;
      visible.forEach(function(card){
        if (card.getBoundingClientRect().top <= 140) best = card;
      });
      document.querySelectorAll("[data-rail]").forEach(function(a){
        a.classList.toggle("is-current", !!best && a.getAttribute("data-rail") === best.id);
      });
    }
    window.addEventListener("scroll", syncRail, { passive:true });
    syncRail();
  })();
  </script>
</body>
</html>
